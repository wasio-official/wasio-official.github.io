<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>题目 — 物理竞赛题库</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6fd0'/%3E%3Ctext x='16' y='23' font-size='19' font-family='serif' fill='white' text-anchor='middle'%3E%CE%A6%3C/text%3E%3C/svg%3E">
<script>
  window.MathJax = {
    tex: {
      inlineMath: [["\\(", "\\)"]],
      displayMath: [["\\[", "\\]"]],
      processEscapes: true,
      packages: { "[+]": ["ams", "boldsymbol", "physics"] }
    },
    options: {
      skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"],
      ignoreHtmlClass: "no-mathjax"
    },
    svg: { fontCache: "global" },
    startup: { typeset: false }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

<header class="topbar"><div class="topbar-inner"></div></header>

<main class="wrap">

  <section class="q-head" id="q-head">
    <div class="loading"><div class="spinner"></div>正在加载题目…</div>
  </section>

  <div class="toolbar" style="justify-content:flex-end">
    <button class="btn btn-primary" id="btn-toggle-all">显示全部</button>
  </div>

  <div id="q-main"></div>

</main>

<footer class="footer">
  物理竞赛题库 · 内容来自个人整理的竞赛试卷资料，仅供学习交流使用。<br>
  提示：可用键盘 ← → 切换上一题 / 下一题。
</footer>

<script src="assets/app.js"></script>
<script src="assets/question.js"></script>
</body>
</html>
