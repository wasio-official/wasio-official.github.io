<script>
/* 兜底提示（所有页面通用）：本站正文全靠 JS 渲染，脚本一旦解析或执行失败
   （例如旧版 Safari 不支持某些新语法）就是纯白屏、毫无提示。
   这段刻意写成 ES5 —— 没有箭头函数、const/let、模板字符串、?.、?? ——
   保证在「导致 app.js 报错的那个老浏览器」里它自己还能跑起来。
   同一页面只提示一次；图片等资源 404 不提示（那时 e.target 不是 window）。 */
(function () {
  var shown = false;
  function paint(msg) {
    if (shown) return;
    shown = true;
    var text = "页面加载出错：" + msg + "　请使用最新版 Chrome / Safari，或刷新重试";
    function put() {
      try {
        var bar = document.createElement("div");
        bar.id = "compat-js-error";
        bar.setAttribute("role", "alert");
        bar.style.cssText =
          "position:fixed;left:0;right:0;top:0;z-index:2147483647;" +
          "background:#1f2430;color:#fff;border-bottom:1px solid #000;" +
          "padding:10px 14px;text-align:center;" +
          "font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;" +
          "box-shadow:0 2px 10px rgba(0,0,0,.35);";
        bar.textContent = text;
        var host = document.body || document.documentElement;
        host.insertBefore(bar, host.firstChild);
      } catch (err) { /* 提示条自己失败就算了，别再连带把页面搞崩 */ }
    }
    if (document.body) put();
    else if (document.addEventListener) document.addEventListener("DOMContentLoaded", put, false);
    else setTimeout(put, 0);
  }
  function brief(v) {
    var s = "";
    if (v && v.message) s = String(v.message);
    else if (v) s = String(v);
    s = s.replace(/\s+/g, " ");
    if (s.length > 80) s = s.slice(0, 80) + "…";
    return s || "未知错误";
  }
  if (!window.addEventListener) return;
  window.addEventListener("error", function (e) {
    if (!e || (e.target && e.target !== window)) return;
    if (e.error) paint(brief(e.error));
    else if (e.message) paint(brief(e.message));
  }, false);
  window.addEventListener("unhandledrejection", function (e) {
    paint(brief(e && e.reason));
  }, false);
})();
</script>
<script>
  window.MathJax = {
    // ⚠️ 这里**不要**加 loader 块。
    // tex-svg-full 这个构建已经把 ams / boldsymbol / physics / bm 等扩展全部打包好了；
    // 再写 loader 会让 MathJax 初始化直接失败（症状：window.MathJax.typesetPromise
    // 不存在，公式一个都不渲染）。实测三种组合：基础版 + loader ✗、
    // full 版 + loader ✗、full 版不写 loader ✓。
    tex: {
      inlineMath: [["\\(", "\\)"]],
      displayMath: [["\\[", "\\]"]],
      processEscapes: true,
      // 这些宏包在 full 构建里都有；"[+]" 是「在默认集合上追加」的写法。
      packages: { "[+]": ["ams", "boldsymbol", "physics", "bm"] }
    },
    options: {
      skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"],
      ignoreHtmlClass: "no-mathjax"
    },
    // SVG 输出：字形是内嵌 path，不额外下载 woff 字体，断网也能正确显示。
    svg: { fontCache: "global" },
    startup: { typeset: false }
  };
</script>
<!-- 用 tex-svg-full（SVG 版 full 构建），两个理由：
     ① 基础版 tex-mml-chtml / tex-mml-svg 不含 boldsymbol 扩展，\boldsymbol 会被
        当成未知命令原样输出（渲染成纯文本 "boldsymbolB"），而且**不报错**，很难发现；
     ② CHTML 版要额外下载 woff 字体，国内网络或断网时会花版，SVG 版把字形内嵌进
        SVG，没有字体请求。
     加载顺序：本地自托管 → jsDelivr → unpkg → cdnjs，任一成功即停止；
     本地文件存在时完全不碰 CDN（断网可用的关键）。 -->
<script>
  (function () {
    var urls = [
      "assets/mathjax/tex-svg-full.js",
      "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg-full.js",
      "https://unpkg.com/mathjax@3.2.2/es5/tex-svg-full.js",
      "https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg-full.js"
    ];
    var i = 0;
    function tryNext() {
      if (i >= urls.length) return; // 全失败：app.js 的 mathReady() 轮询超时后降级
      var s = document.createElement("script");
      s.src = urls[i++];
      s.async = true;
      s.onload = function () {};              // 成功即停，不再试后面的
      s.onerror = function () { tryNext(); }; // 失败才退到下一个源
      var head = document.head || document.getElementsByTagName("head")[0];
      head.appendChild(s);
    }
    tryNext();
  })();
</script>
