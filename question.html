<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wasio的题目 — 物理竞赛题库</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#2f6fd0">
<script>
  window.MathJax = {
    tex: {
      inlineMath: [["\\(", "\\)"]],
      displayMath: [["\\[", "\\]"]],
      processEscapes: true,
      packages: { "[+]": ["ams", "boldsymbol", "physics"] }
    },
    options: {
      skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"],
      ignoreHtmlClass: "no-mathjax"
    },
    svg: { fontCache: "global" },
    startup: { typeset: false }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

<header class="topbar"><div class="topbar-inner"></div></header>

<main class="wrap">

  <section class="q-head" id="q-head">
    <div class="loading"><div class="spinner"></div>正在加载题目…</div>
  </section>

  <div class="toolbar" style="justify-content:flex-end">
    <button class="btn btn-primary" id="btn-toggle-all">显示全部</button>
  </div>

  <div id="q-main"></div>

</main>

<footer class="footer">
  <p class="footer-line">
    物理竞赛题库 · 内容来自个人整理的竞赛试卷资料，仅供学习交流使用。
  </p>
  <p class="footer-line">提示：可用键盘 ← → 切换上一题 / 下一题。</p>
  <p class="footer-line footer-bili"><a href="https://space.bilibili.com/1382640092" target="_blank" rel="noopener">WASIO 的 B 站主页</a></p>
</footer>

<script src="assets/app.js"></script>
<script src="assets/question.js"></script>
</body>
</html>
