<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wasio的题目 — 物理竞赛题库</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#2f6fd0">
<script>
  window.MathJax = {
    // ⚠️ 这里**不要**写 loader 块。
    // tex-chtml-full 这个构建已经把 boldsymbol / physics / bm / ams 等扩展
    // 全部打包进去了，再写 loader 会让 MathJax 初始化直接失败
    // （症状：window.MathJax.typesetPromise 不存在，全站公式一个都不渲染）。
    // 实测三种组合：基础版+loader ✗、full版+loader ✗、full版不写loader ✓。
    tex: {
      inlineMath: [["\\(", "\\)"]],
      displayMath: [["\\[", "\\]"]],
      processEscapes: true,
      // 这些宏包在 full 构建里都有；「[+]」是「在默认集合上追加」的写法。
      packages: { "[+]": ["ams", "boldsymbol", "physics", "bm"] }
    },
    options: {
      skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"],
      ignoreHtmlClass: "no-mathjax"
    },
    svg: { fontCache: "global" },
    startup: { typeset: false }
  };
</script>
<!-- 必须用 tex-chtml-full：
     基础版 tex-mml-chtml 不含 boldsymbol 扩展，\boldsymbol 会当未知命令
     原样输出（渲染成纯文本 "boldsymbolB"），且**不报错**，很难发现。 -->
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js"></script>
</head>
<body>

<header class="topbar"><div class="topbar-inner"></div></header>

<main class="wrap">

  <section class="q-head" id="q-head">
    <div class="loading"><div class="spinner"></div>正在加载题目…</div>
  </section>

  <div class="toolbar" style="justify-content:flex-end">
    <button class="btn btn-primary" id="btn-toggle-all">显示全部</button>
  </div>

  <div id="q-main"></div>

  <div id="ps-bar"></div>

</main>

<footer class="footer">
  <p class="footer-line">
    物理竞赛题库 · 内容来自个人整理的竞赛试卷资料，仅供学习交流使用。
  </p>
  <p class="footer-line">提示：可用键盘 ← → 切换上一题 / 下一题。</p>
  <p class="footer-line footer-bili"><a href="https://space.bilibili.com/1382640092" target="_blank" rel="noopener">WASIO 的 B 站主页</a></p>
  <p class="footer-line footer-visits" id="visit-count" hidden>本站总访客数 <span id="visit-uv">—</span> 人</p>
</footer>

<script src="assets/app.js"></script>
<script src="assets/paperset.js"></script>
<script src="assets/question.js"></script>
<script src="assets/visits.js"></script>
</body>
</html>
