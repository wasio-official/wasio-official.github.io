<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="assets/favicon.ico" sizes="any">

<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#2f6fd0">
</head>
<body>

<header class="topbar"><div class="topbar-inner"></div></header>

<footer class="footer">
  <img class="footer-brand" src="assets/wasio-word.png" alt="WASIO" height="22">

    物理竞赛题库 · 内容来自<a href="https://space.bilibili.com/1382640092" target="_blank" rel="noopener">个人整理的竞赛试卷资料</a>，仅供学习交流使用。
