<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>题库 — 物理竞赛题库</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#2f6fd0">
</head>
<body>

<header class="topbar"><div class="topbar-inner"></div></header>

<main class="wrap">

  <section class="page-head">
    <h1>题库</h1>
    <p class="page-desc">
      全部试卷目录，按名称或考点标签检索，点击试卷进入按题浏览。
    </p>
  </section>

  <div class="toolbar" id="search">
    <label class="search">
      <input id="f-q" type="search" placeholder="搜索试卷名或考点标签…" autocomplete="off">
    </label>
    <select class="ctl" id="f-cat"></select>
    <select class="ctl" id="f-sort">
      <option value="year">按年份</option>
      <option value="count">按题量</option>
      <option value="name">按名称</option>
    </select>
  </div>

  <p class="result-line" id="result-line"></p>

  <div class="paper-grid" id="grid">
    <div class="loading" style="grid-column:1/-1">
      <div class="spinner"></div>
      正在加载题库…
    </div>
  </div>

</main>

<footer class="footer">
  <img class="footer-brand" src="assets/wasio-word.png" alt="WASIO" height="22">
  <p class="footer-line">
    物理竞赛题库 · 内容来自<a href="https://space.bilibili.com/1382640092" target="_blank" rel="noopener">个人整理的竞赛试卷资料</a>，仅供学习交流使用。
  </p>
  <p class="footer-line footer-bili"><a href="https://space.bilibili.com/1382640092" target="_blank" rel="noopener">WASIO 的 B 站主页</a></p>
</footer>

<script src="assets/app.js"></script>
<script src="assets/library.js"></script>
</body>
</html>
