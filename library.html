<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>题库 — 物理竞赛题库</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6fd0'/%3E%3Ctext x='16' y='23' font-size='19' font-family='serif' fill='white' text-anchor='middle'%3E%CE%A6%3C/text%3E%3C/svg%3E">
</head>
<body>

<header class="topbar"><div class="topbar-inner"></div></header>

<main class="wrap">

  <section class="page-head">
    <h1>题库</h1>
    <p class="page-desc">
      全部试卷目录，按名称或考点标签检索，点击试卷进入按题浏览。
    </p>
  </section>

  <div class="toolbar" id="search">
    <label class="search">
      <input id="f-q" type="search" placeholder="搜索试卷名或考点标签…" autocomplete="off">
    </label>
    <select class="ctl" id="f-cat"></select>
    <select class="ctl" id="f-sort">
      <option value="year">按年份</option>
      <option value="count">按题量</option>
      <option value="name">按名称</option>
    </select>
  </div>

  <p class="result-line" id="result-line"></p>

  <div class="paper-grid" id="grid">
    <div class="loading" style="grid-column:1/-1">
      <div class="spinner"></div>
      正在加载题库…
    </div>
  </div>

</main>

<footer class="footer">
  物理竞赛题库 · 内容来自个人整理的竞赛试卷资料，仅供学习交流使用。
</footer>

<script src="assets/app.js"></script>
<script src="assets/library.js"></script>
</body>
</html>
