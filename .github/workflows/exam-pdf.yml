name: 出卷 PDF

# 触发方式（两种）：
#   1) 本页 «Run workflow»：直接粘贴 paperset JSON（或留空，处理 papersets/inbox/*.json）
#   2) push 到 papersets/inbox/*.json：把网站导出的 JSON 上传/提交到这里即自动出卷
#
# ⚠ 防自激：下面的 push 触发**只**匹配 papersets/inbox/*.json，
#   而本流程最后提交的是 pdfs/（PDF + index.json），不在 paths 里 → 不会再次触发。
#   （理论上 GITHUB_TOKEN 推送也不会触发 workflow，这里是双保险；别放宽 paths。）
on:
  workflow_dispatch:
    inputs:
      paperset_json:
        description: 'paperset JSON 内容（留空则处理 papersets/inbox/*.json）'
        required: false
        type: string
      mode:
        description: '出哪几份：both / questions / answers'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - questions
          - answers
  push:
    paths:
      - 'papersets/inbox/*.json'

# 需要写权限：出卷完成后要把 pdfs/ 提交回 main，让 Pages 当静态文件发布
# （站点 pdfs.html 免登录下载）。只改 pdfs/，不碰题库数据。
permissions:
  contents: write

jobs:
  exam-pdf:
    name: 组卷 → PDF
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        # ⚠ 仓库工作树约 430 MB（data/images 占 380 MB），全量检出约 1–2 分钟。
        # 若觉得慢，可改成 sparse-checkout 只取 tools/ + data/ + papersets/：
        #   with:
        #     sparse-checkout: |
        #       tools
        #       data
        #       papersets
        #     sparse-checkout-cone-mode: true
        # （sparse 时 .github/ 与根目录文件仍会被取到；papersets/ 必须保留。）

      - name: 安装 TeX Live 与中文字体（带 apt 缓存）
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          # texlive-xetex       → xelatex
          # texlive-lang-chinese→ ctex / xeCJK
          # latex-extra         → adjustbox、needspace、newunicodechar 等
          # fonts-noto-cjk      → Linux 上替代 MS Mincho 的符号回退字体
          # poppler-utils       → pdfinfo（统计页数）
          packages: >-
            texlive-xetex texlive-lang-chinese texlive-latex-extra
            texlive-latex-recommended texlive-fonts-recommended
            texlive-science latexmk fonts-noto-cjk poppler-utils
          version: 1.0

      - name: 环境自检
        # 只诊断不阻断：真正的门是后面的「生成 PDF / 校验产物」。
        # 自检内容全部写进 Step Summary，出问题时不用登录也能看到原因。
        run: |
          set +e
          CHECK_OUT=$(python3 tools/pdfgen.py --check 2>&1)
          CHECK_CODE=$?
          echo "$CHECK_OUT"
          echo "自检退出码: $CHECK_CODE"

          {
            echo "### 环境自检（退出码 $CHECK_CODE）"
            echo ""
            echo '```'
            echo "$CHECK_OUT"
            echo ""
            echo "--- xelatex ---"
            command -v xelatex || echo "xelatex 不在 PATH"
            xelatex --version 2>&1 | head -2
            echo ""
            echo "--- 关键 LaTeX 宏包 ---"
            for sty in ctex.sty xeCJK.sty fontspec.sty adjustbox.sty tabularx.sty \
                       wrapfig.sty needspace.sty lastpage.sty fancyhdr.sty newunicodechar.sty; do
              path=$(kpsewhich "$sty" 2>/dev/null)
              printf '%-20s %s\n' "$sty" "${path:-缺失（检查 apt 包）}"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 缺字体/缺可选工具都不该让整个发布失败，交后续步骤判定
          exit 0

      - name: 写入粘贴的 paperset JSON
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.paperset_json != ''
        env:
          PAPERSET_JSON: ${{ github.event.inputs.paperset_json }}
        run: |
          set -euo pipefail
          mkdir -p papersets/work
          python3 - "$PAPERSET_JSON" <<'PY'
          import json
          import pathlib
          import sys

          raw = sys.argv[1]
          try:
              data = json.loads(raw)
          except Exception as exc:
              print(f"::error::粘贴的 JSON 解析失败：{exc}")
              sys.exit(1)
          if data.get("format") != "wasio-paperset":
              print("::error::这不是本站导出的选题目录（format 不是 wasio-paperset）")
              sys.exit(1)
          pathlib.Path("papersets/work/input.json").write_text(raw, encoding="utf-8")
          print(f"已接收粘贴的 JSON：{len(data.get('items') or [])} 题")
          PY

      - name: 收集待处理的 paperset
        run: |
          set -euo pipefail
          mkdir -p papersets/work out
          if [ -f papersets/work/input.json ]; then
            printf '%s\n' "papersets/work/input.json" > papersets/work/list.txt
          else
            shopt -s nullglob
            files=(papersets/inbox/*.json)
            if [ ${#files[@]} -eq 0 ]; then
              echo "::error::没有待处理的 paperset：papersets/inbox/ 里没有 .json，也没粘贴 JSON"
              exit 1
            fi
            printf '%s\n' "${files[@]}" > papersets/work/list.txt
          fi
          echo "待处理 $(wc -l < papersets/work/list.txt) 个文件："
          sed 's/^/  /' papersets/work/list.txt

      - name: 生成 PDF
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set +e            # 单个文件失败不中断其余文件，最后统一置失败
          set -uo pipefail
          mode="${MODE:-both}"
          echo "模式：$mode"
          fail=0
          i=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            i=$((i + 1))
            stem="$(basename "$f" .json)"
            echo "::group::[$i] $f"
            # 数据在仓库里，--offline 保证全程不联网；输出目录带序号避免同名覆盖
            # 控制台输出同时落盘到 out/<i>-<stem>/console.txt，随日志一起发布到站点
            mkdir -p "out/${i}-${stem}"
            python3 tools/pdfgen.py "$f" -o "out/${i}-${stem}" --mode "$mode" --offline 2>&1 \
              | tee "out/${i}-${stem}/console.txt"
            code=${PIPESTATUS[0]}
            if [ "$code" -eq 0 ]; then
              echo "✓ 完成：$f"
            else
              echo "::error::出卷失败：$f（退出码 $code，控制台输出见 pdfs/build-logs/）"
              fail=1
            fi
            echo "::endgroup::"
          done < papersets/work/list.txt
          echo "共处理 $i 个 paperset，失败标记=$fail"
          exit "$fail"

      - name: 收集编译日志到站点（免登录排查用）
        if: always()
        # Actions 的日志要登录才能看。把每份 .log / 控制台输出复制到 pdfs/build-logs/，
        # 由后面的「发布到站点」一起提交，于是从站点就能直接读到 Linux 上的报错。
        # 每次运行先清空，只保留最近一次的。
        run: |
          set +e
          rm -rf pdfs/build-logs
          mkdir -p pdfs/build-logs
          find out -type f -name '*.log' | while IFS= read -r f; do
            base=$(echo "$f" | sed 's|^out/||; s|/|__|g')
            cp "$f" "pdfs/build-logs/$base"
          done
          find out -type f -name 'console.txt' | while IFS= read -r f; do
            base=$(echo "$f" | sed 's|^out/||; s|/|__|g')
            cp "$f" "pdfs/build-logs/$base"
          done
          ls -la pdfs/build-logs | head -20 || true

      - name: 校验产物
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          count=$(find out -type f -name '*.pdf' | wc -l)
          echo "PDF 数量：$count"
          if [ "$count" -eq 0 ]; then
            echo "::error::没有生成任何 PDF"
            exit 1
          fi

      - name: 写入出卷摘要
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess

          out = pathlib.Path("out")
          pdfs = sorted(out.rglob("*.pdf")) if out.is_dir() else []
          lines = ["## 出卷完成", ""]
          if not pdfs:
              lines.append("> ⚠ 没有生成任何 PDF，失败原因见 artifact 里的 `.log`。")
          else:
              lines += ["| 文件 | 页数 | 大小 |", "|---|---|---|"]
              for p in pdfs:
                  pages = "?"
                  try:
                      info = subprocess.run(["pdfinfo", str(p)], capture_output=True,
                                            text=True, timeout=60).stdout
                      for line in info.splitlines():
                          if line.startswith("Pages:"):
                              pages = line.split(":", 1)[1].strip()
                              break
                  except Exception:
                      pass
                  size = p.stat().st_size
                  size_txt = (f"{size / 1024 / 1024:.2f} MB" if size >= 1024 * 1024
                              else f"{size / 1024:.0f} KB")
                  lines.append(f"| `{p}` | {pages} | {size_txt} |")
              lines += ["", f"共 {len(pdfs)} 个 PDF。artifact：`exam-pdf-"
                        f"{os.environ.get('GITHUB_RUN_NUMBER', '')}`。"]
          text = "\n".join(lines) + "\n"
          print(text)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(text)
          PY

      - name: 上传 PDF（artifact）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exam-pdf-${{ github.run_number }}
          path: out/**/*.pdf
          if-no-files-found: warn
          retention-days: 90

      # ---------------------------------------------------------------- 发布到站点
      # 把 out/ 里的 PDF 提交回仓库根的 pdfs/，由 GitHub Pages 当静态文件发布，
      # 站点 pdfs.html 就能免登录直接下载（artifact 仍保留：要登录 GitHub 才能下）。
      # 复杂逻辑（命名 / 索引合并 / 去重 / 30 组淘汰）在 Python 脚本里，
      # 同一脚本本地能跑：python3 .github/scripts/publish_pdfs.py --help
      - name: 发布到站点
        if: always()
        env:
          MSG_FILE: ${{ runner.temp }}/pdf-commit-msg.txt
        run: |
          set -euo pipefail

          publish() {
            python3 .github/scripts/publish_pdfs.py \
              --out out \
              --dest pdfs \
              --run-number "$GITHUB_RUN_NUMBER" \
              --run-id "$GITHUB_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --keep 30 \
              --commit-msg-file "$MSG_FILE"
          }

          publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg="$(cat "$MSG_FILE")"

          # 并发保护：推送失败就把「最新 main」拿过来，把本次结果重新合并进去再推。
          # 为什么不用 git pull --rebase：checkout 默认 depth=1 的浅克隆，
          # 本地提交的父提交是 graft 出来的根，rebase 找不到 merge base 会失败；
          # 「重放」不需要历史 —— index.json 的合并由脚本在最新索引上重做一遍（幂等）。
          for attempt in 1 2 3; do
            git add pdfs/
            if git diff --cached --quiet; then
              echo "pdfs/ 没有需要提交的改动（本次结果已在索引里），结束"
              exit 0
            fi
            git commit -m "$msg"
            if git push origin HEAD:main; then
              echo "已推送 pdfs/（第 $attempt 次尝试）"
              exit 0
            fi

            echo "第 $attempt 次推送失败，取最新 main 后重试…"
            git fetch --depth=1 origin main
            git reset --mixed FETCH_HEAD                    # HEAD/索引对齐远端
            git checkout -- pdfs/ 2>/dev/null || true       # 历史 index.json 用远端的
            publish                                         # 在最新索引上重新合并
          done

          echo "::error::推送 pdfs/ 失败（已重试 3 次）；artifact 仍可下载"
          exit 1

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exam-pdf-logs-${{ github.run_number }}
          # .log 用来定位 xelatex 报错；.tex 便于本地复现
          path: |
            out/**/*.log
            out/**/*.tex
          if-no-files-found: ignore
          retention-days: 30
