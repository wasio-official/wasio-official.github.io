<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wasio的网页出卷 — 物理竞赛题库</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#2f6fd0">
<script>
/* 兜底提示（所有页面通用）：本站正文全靠 JS 渲染，脚本一旦解析或执行失败
   （例如旧版 Safari 不支持某些新语法）就是纯白屏、毫无提示。
   这段刻意写成 ES5 —— 没有箭头函数、const/let、模板字符串、?.、?? ——
   保证在「导致 app.js 报错的那个老浏览器」里它自己还能跑起来。
   同一页面只提示一次；图片等资源 404 不提示（那时 e.target 不是 window）。 */
(function () {
  var shown = false;
  function paint(msg) {
    if (shown) return;
    shown = true;
    var text = "页面加载出错：" + msg + "　请使用最新版 Chrome / Safari，或刷新重试";
    function put() {
      try {
        var bar = document.createElement("div");
        bar.id = "compat-js-error";
        bar.setAttribute("role", "alert");
        bar.style.cssText =
          "position:fixed;left:0;right:0;top:0;z-index:2147483647;" +
          "background:#1f2430;color:#fff;border-bottom:1px solid #000;" +
          "padding:10px 14px;text-align:center;" +
          "font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;" +
          "box-shadow:0 2px 10px rgba(0,0,0,.35);";
        bar.textContent = text;
        var host = document.body || document.documentElement;
        host.insertBefore(bar, host.firstChild);
      } catch (err) { /* 提示条自己失败就算了，别再连带把页面搞崩 */ }
    }
    if (document.body) put();
    else if (document.addEventListener) document.addEventListener("DOMContentLoaded", put, false);
    else setTimeout(put, 0);
  }
  function brief(v) {
    var s = "";
    if (v && v.message) s = String(v.message);
    else if (v) s = String(v);
    s = s.replace(/\s+/g, " ");
    if (s.length > 80) s = s.slice(0, 80) + "…";
    return s || "未知错误";
  }
  if (!window.addEventListener) return;
  window.addEventListener("error", function (e) {
    if (!e || (e.target && e.target !== window)) return;
    if (e.error) paint(brief(e.error));
    else if (e.message) paint(brief(e.message));
  }, false);
  window.addEventListener("unhandledrejection", function (e) {
    paint(brief(e && e.reason));
  }, false);
})();
</script>
<script>
  window.MathJax = {
    // ⚠️ 这里**不要**加 loader 块。
    // tex-svg-full 这个构建已经把 ams / boldsymbol / physics / bm 等扩展全部打包好了；
    // 再写 loader 会让 MathJax 初始化直接失败（症状：window.MathJax.typesetPromise
    // 不存在，公式一个都不渲染）。实测三种组合：基础版 + loader ✗、
    // full 版 + loader ✗、full 版不写 loader ✓。
    tex: {
      inlineMath: [["\\(", "\\)"]],
      displayMath: [["\\[", "\\]"]],
      processEscapes: true,
      // 这些宏包在 full 构建里都有；"[+]" 是「在默认集合上追加」的写法。
      packages: { "[+]": ["ams", "boldsymbol", "physics", "bm"] }
    },
    options: {
      skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"],
      ignoreHtmlClass: "no-mathjax"
    },
    // SVG 输出：字形是内嵌 path，不额外下载 woff 字体，断网也能正确显示。
    // ⚠️ 这里必须是 "local"（每个公式自带 <defs>），不能是 "global"：
    //    「下载 PDF」用 html2canvas 逐页把内联 SVG 序列化成图片，global 缓存的
    //    字形定义在 <body> 的隐藏 SVG 里，序列化单个公式 SVG 时会引用不到而丢字。
    svg: { fontCache: "local" },
    startup: { typeset: false }
  };
</script>
<!-- 用 tex-svg-full（SVG 版 full 构建），两个理由：
     ① 基础版 tex-mml-chtml / tex-mml-svg 不含 boldsymbol 扩展，\boldsymbol 会被
        当成未知命令原样输出（渲染成纯文本 "boldsymbolB"），而且**不报错**，很难发现；
     ② CHTML 版要额外下载 woff 字体，国内网络或断网时会花版，SVG 版把字形内嵌进
        SVG，没有字体请求。
     加载顺序：本地自托管 → jsDelivr → unpkg → cdnjs，任一成功即停止；
     本地文件存在时完全不碰 CDN（断网可用的关键）。 -->
<script>
  (function () {
    var urls = [
      "assets/mathjax/tex-svg-full.js",
      "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg-full.js",
      "https://unpkg.com/mathjax@3.2.2/es5/tex-svg-full.js",
      "https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg-full.js"
    ];
    var i = 0;
    function tryNext() {
      if (i >= urls.length) return; // 全失败：app.js 的 mathReady() 轮询超时后降级
      var s = document.createElement("script");
      s.src = urls[i++];
      s.async = true;
      s.onload = function () {};              // 成功即停，不再试后面的
      s.onerror = function () { tryNext(); }; // 失败才退到下一个源
      var head = document.head || document.getElementsByTagName("head")[0];
      head.appendChild(s);
    }
    tryNext();
  })();
</script>

<style>
/* ============================================================
   网页出卷页：工具区（打印隐藏）+ A4 纸面预览
   ------------------------------------------------------------
   打印时只保留 #paper；@page 负责真正的页边距，
   屏幕上的 210mm 纸面只是「所见即所得」的预览。
   ============================================================ */

/* html2canvas 不认 MathJax 给无障碍副本加的裁剪样式，
   会把 <mjx-assistive-mml> 里的 MathML 也画一遍，
   于是公式出现重影（字形叠字形）。导出页直接隐藏它。
   打印走浏览器排版，不受影响。 */
mjx-assistive-mml {
  display: none !important;
}

@page {
  size: A4;
  margin: 18mm 16mm;
}

/* ---------- 工具区 ---------- */

.pg-panel {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 16px 18px;
  margin-bottom: 16px;
}

.pg-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 12px 16px;
}
.pg-grid label {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  color: var(--ink-mute);
}
.pg-grid input[type="text"],
.pg-grid input[type="number"] {
  height: 38px;
  padding: 0 10px;
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  outline: none;
}
.pg-grid input[type="text"]:focus,
.pg-grid input[type="number"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.pg-grid .pg-check {
  flex-direction: row;
  align-items: center;
  gap: 8px;
  align-self: end;
  height: 38px;
  padding: 0 2px;
  font-size: 14px;
  color: var(--ink);
  cursor: pointer;
}
.pg-grid .pg-check input {
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
}

.pg-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
}
.pg-note {
  margin: 10px 0 0;
  font-size: 13px;
  color: var(--ink-mute);
}
.pg-note b { color: var(--ink-soft); font-weight: 600; }

/* ---------- 上传 / 粘贴 ---------- */

.pg-upload { margin-bottom: 18px; }

.pg-drop {
  border: 1.5px dashed var(--line-strong);
  border-radius: var(--radius);
  background: var(--bg-elev);
  padding: 22px 18px;
  text-align: center;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.pg-drop:hover,
.pg-drop:focus-visible {
  border-color: var(--accent);
  background: var(--accent-soft);
  outline: none;
}
.pg-drop.is-over {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.pg-drop strong {
  display: block;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
}
.pg-drop span {
  font-size: 13px;
  color: var(--ink-mute);
}

.pg-paste {
  margin-top: 12px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 14px;
}
.pg-paste > summary {
  cursor: pointer;
  font-size: 14px;
  color: var(--ink-soft);
  user-select: none;
}
.pg-paste[open] > summary { margin-bottom: 10px; }
.pg-paste textarea {
  width: 100%;
  min-height: 96px;
  padding: 10px 12px;
  font: 12.5px/1.55 var(--mono);
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  outline: none;
  resize: vertical;
}
.pg-paste textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.pg-paste .btn { margin-top: 10px; }

.pg-msg {
  margin: 12px 0 0;
  padding: 9px 14px;
  font-size: 13.5px;
  border-radius: var(--radius-sm);
  background: var(--bg-elev);
  border: 1px solid var(--line-strong);
}
.pg-msg.ok { color: var(--accent-ink); border-color: var(--accent); }
.pg-msg.err { color: #b3261e; border-color: #e0a19c; }
.pg-msg[hidden] { display: none; }

.pg-status {
  margin: 10px 0 0;
  font-size: 13px;
  color: var(--ink-mute);
}

.pg-progress {
  margin: 10px 0 0;
  font-size: 13px;
  color: var(--ink-soft);
}
.pg-progress[hidden] { display: none; }

/* 降级提示时给打印按钮描一圈，引导用户改走打印 */
.pg-print-hint {
  border-color: #e0a19c;
  color: #b3261e;
}

/* ---------- A4 页式预览 ---------- */

/* #paper 只是外层容器：真正的纸面是下面一页一个的 .pg-sheet。
   预览缩放用 transform 加在 .pg-pages 外层，.pg-sheet 本身永远是
   210mm × 297mm —— 这样 html2canvas 抓到的画布尺寸才稳定。 */
.pg-paper {
  position: relative;
  width: 100%;
  margin: 0 auto;
  padding: 0;
  background: none;
  border: 0;
  box-shadow: none;
  color: #111;
  font-size: 15px;
  line-height: 1.8;
}

.pg-pages {
  transform-origin: top center;
}

.pg-pages-outer.is-scaled {
  position: relative;
}
.pg-pages-outer.is-scaled .pg-pages {
  position: absolute;
  left: 50%;
  width: 210mm;
  margin-left: -105mm;
}

/* 预览外框：边框 / 圆角 / 阴影都在外层，截图只抓白纸本身 */
.pg-sheet-wrap {
  width: 210mm;
  margin: 0 auto 18px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

/* 固定 A4 尺寸 + overflow:hidden：分页在生成阶段就做完 */
.pg-sheet {
  box-sizing: border-box;
  width: 210mm;
  height: 297mm;
  padding: 18mm 16mm;
  overflow: hidden;
  background: #fff;
  color: #111;
  font-size: 15px;
  line-height: 1.8;
  text-align: left;
}

/* 测量容器：宽度必须等于 .pg-sheet 的版心（178mm），否则量出的高度对不上。
   它参与布局（MathJax 才能正确排版），但不显示、不占位。 */
.pg-staging {
  position: absolute;
  left: 0;
  top: 0;
  width: 178mm;
  height: 0;
  overflow: hidden;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  z-index: -1;
}

/* 下载 PDF 时把预览缩放临时恢复成 1:1，抓图才是 A4 真实尺寸 */
body.pg-capturing .pg-pages-outer {
  height: auto !important;
  overflow: visible !important;
}
body.pg-capturing .pg-pages {
  position: static !important;
  width: auto !important;
  margin-left: 0 !important;
  transform: none !important;
}

.pg-empty {
  max-width: 60ch;
  margin: 0 auto;
  padding: 26px 4px;
  text-align: center;
  color: var(--ink-mute);
  font-size: 14.5px;
  line-height: 1.9;
}
.pg-empty strong {
  display: block;
  font-size: 17px;
  color: var(--ink-soft);
  margin-bottom: 8px;
}

.paper-part { margin: 0; }

.sheet-head {
  text-align: center;
  margin: 0 0 24px;
}
.sheet-title {
  margin: 0;
  font-size: 1.9em;
  line-height: 1.35;
  font-weight: 700;
  letter-spacing: .01em;
}
.sheet-sub {
  margin: 6px 0 0;
  font-size: 1.05em;
  color: #222;
}
.sheet-meta {
  margin: 10px 0 0;
  font-size: .95em;
  color: #333;
}

.q-item { margin: 0 0 18px; }

/* ⚠️ app.css 里的 .q-item 是「题库列表卡片」（白底 / 边框 / 圆角 / 阴影）。
   出卷页沿用了同名 class，若不压掉，预览和打印出来的每道题都会套一个卡片框。
   用 .pg-paper 前缀提高优先级，让纸面内回到无框的排印样式。 */
.pg-paper .q-item,
.pg-paper .q-item:hover {
  background: none;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  transition: none;
}

.q-md { font-size: 1em; }
.q-md p { margin: 0 0 .7em; }
.q-md p:last-child { margin-bottom: 0; }
.q-md ul,
.q-md ol { margin: 0 0 .8em; padding-left: 1.6em; }
.q-md li { margin-bottom: .3em; }
.q-md blockquote {
  margin: 0 0 .8em;
  padding: 0 0 0 .8em;
  border-left: 2px solid #cdd3dc;
  color: #333;
}
.q-md code {
  font-family: var(--mono);
  font-size: .88em;
  background: #f0f2f5;
  padding: 1px 4px;
  border-radius: 3px;
}
.q-md table {
  border-collapse: collapse;
  width: 100%;
  margin: 0 0 .8em;
  font-size: .92em;
}
.q-md th,
.q-md td {
  border: 1px solid #ddd;
  padding: 3px 6px;
  text-align: left;
}
.q-md hr { border: none; border-top: 1px solid #ddd; margin: 12px 0; }

.q-no {
  font-weight: 700;
  margin-right: .2em;
}

.q-md img {
  display: block;
  max-width: 100%;
  max-height: 45vh;
  width: auto;
  height: auto;
  margin: 10px auto;
  border: 1px solid #e3e6eb;
  background: #fff;
}
/* 图片加载失败：JS 会把 <img> 换成这个占位 <span>，预览和打印都能看到文字 */
.q-md .img-missing {
  display: block;
  margin: 10px auto;
  padding: 8px 10px;
  border: 1px dashed #d1544a;
  border-radius: 4px;
  color: #b3261e;
  font-size: .92em;
  text-align: center;
  word-break: break-all;
}

/* 答案区：与题干之间一条很轻的分隔线，便于对照 */
.q-ans {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed #e3e6eb;
}
.q-ans .q-md { margin-top: 8px; }
.q-ans .q-md:first-child { margin-top: 0; }
.q-label { font-weight: 700; }

/* 超长题 / 长解析在段落边界拆到下一页时，续页不再重复答案分隔线 */
.q-item.q-cont .q-ans {
  margin-top: 0;
  padding-top: 0;
  border-top: 0;
}

.pg-paper .math-block {
  margin: .6em 0;
  text-align: center;
}
.pg-paper mjx-container { max-width: 100%; }
.pg-paper mjx-container[display="true"] {
  display: block;
  margin: .45em 0;
  max-width: 100%;
}

/* ---------- 窄屏：整叠纸面等比缩小预览，打印仍走 A4 ---------- */

@media (max-width: 820px) {
  /* JS 算 transform 缩放；万一脚本没跑起来，至少还能横向滚动看全 */
  .pg-pages-outer { overflow-x: auto; }
  .pg-sheet-wrap { margin-bottom: 14px; }
  .pg-actions .btn { flex: 1 1 auto; }
}

/* ---------- 打印 ---------- */

@media print {
  html,
  body {
    background: #fff !important;
  }
  .topbar,
  .footer,
  .no-print,
  .pg-empty,
  .pg-msg,
  .pg-status,
  .pg-progress {
    display: none !important;
  }
  .wrap.pg-wrap {
    max-width: none;
    margin: 0;
    padding: 0;
  }

  /* 屏幕上是固定的 A4 页容器；打印时交回浏览器按 @page 自然排版，
     文字才能保持「可选中」的高质量。 */
  .pg-paper,
  .pg-pages-outer {
    position: static !important;
    width: auto;
    max-width: none;
    min-height: 0;
    height: auto !important;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    overflow: visible !important;
    font-size: 10.5pt;
    line-height: 1.7;
    color: #000;
  }
  .pg-pages {
    position: static !important;
    width: auto !important;
    margin: 0 !important;
    transform: none !important;
  }
  .pg-sheet-wrap {
    width: auto;
    margin: 0;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    overflow: visible;
    break-after: page;
    page-break-after: always;
  }
  .pg-sheet-wrap:last-child {
    break-after: auto;
    page-break-after: auto;
  }
  .pg-sheet {
    width: auto;
    height: auto;
    min-height: 0;
    padding: 0;
    border: 0;
    box-shadow: none;
    overflow: visible;
    font-size: 10.5pt;
    line-height: 1.7;
    color: #000;
  }

  .sheet-head { margin-bottom: 14pt; }
  .sheet-title { font-size: 1.9em; }
  .sheet-sub { font-size: 1.05em; }
  .sheet-meta { font-size: .95em; }

  .q-item { margin: 0 0 12pt; }
  .q-md p { margin: 0 0 .6em; }
  .q-md img {
    max-height: 117mm;
    border: 0;
  }
  .q-ans { margin-top: 8pt; padding-top: 6pt; }
  .q-label { break-after: avoid; page-break-after: avoid; }

  /* 分页已经在生成阶段做完（每个 .pg-sheet-wrap 就是一页），
     打印时不再按「一题一页」强制拆页；一页内交给浏览器自然排。 */

  /* 整份：题卷与答案卷各自从新页开始 */
  .paper-part + .paper-part {
    break-before: page;
    page-break-before: always;
  }
  .sheet-head {
    break-after: avoid;
    page-break-after: avoid;
  }
}
</style>
</head>
<body>
<noscript>
  <div style="margin:0;padding:14px 16px;background:#1f2430;color:#fff;text-align:center;font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;">
    本页面需要启用 JavaScript 才能生成试卷。
  </div>
</noscript>

<header class="topbar no-print"><div class="topbar-inner"></div></header>

<main class="wrap pg-wrap">

  <section class="page-head no-print">
    <h1>网页出卷</h1>
    <p class="page-desc">
      把组卷目录排成 A4 文档：点「下载 PDF」直接拿到文件，或用「打印 → 存为 PDF」。
      题目在页面里现场渲染，<b>JSON 不会上传，也不会出现在站点任何地方</b>。
    </p>
  </section>

  <section class="pg-panel no-print" id="pg-panel">
    <div class="pg-grid">
      <label>试卷标题
        <input id="pg-title" type="text" autocomplete="off" placeholder="留空自动命名">
      </label>
      <label>副标题
        <input id="pg-subtitle" type="text" autocomplete="off" placeholder="可留空">
      </label>
      <label>考试时长（分钟）
        <input id="pg-duration" type="number" min="0" step="5" placeholder="如 180">
      </label>
      <label class="pg-check">
        <input id="pg-analysis" type="checkbox" checked>
        含解析与答案
      </label>
    </div>
    <div class="pg-actions">
      <button class="btn btn-primary" id="pg-dl-q" type="button" disabled>下载题卷 PDF</button>
      <button class="btn" id="pg-dl-a" type="button" disabled>下载答案卷 PDF</button>
      <button class="btn" id="pg-dl-both" type="button" disabled>下载整份 PDF</button>
    </div>
    <p class="pg-progress" id="pg-progress" hidden aria-live="polite"></p>
    <div class="pg-actions pg-actions-print">
      <button class="btn" id="pg-print-q" type="button" disabled>打印题卷</button>
      <button class="btn" id="pg-print-a" type="button" disabled>打印答案卷</button>
      <button class="btn" id="pg-print-both" type="button" disabled>打印整份</button>
    </div>
    <p class="pg-note" id="pg-dl-note">
      「下载 PDF」在本机直接生成文件（每页是一张 2× 渲染的图片，文字不可选中）；
      「打印」仍保留，打印或另存出来的文字可选中、质量更高。
    </p>
  </section>

  <section class="pg-upload no-print" id="pg-upload">
    <div class="pg-drop" id="pg-drop" role="button" tabindex="0"
         aria-label="上传组卷 JSON 文件，也可以把文件拖到这里">
      <strong>拖入组卷 JSON，或点击选择文件</strong>
      <span>支持本站「导选出卷目录」生成的 .json；也可以把 JSON 文本粘贴到下面</span>
    </div>
    <input type="file" id="pg-file" accept=".json,application/json" hidden>

    <details class="pg-paste">
      <summary>没有文件？把 JSON 文本粘贴到这里</summary>
      <textarea id="pg-json" spellcheck="false"
        placeholder='{ "format": "wasio-paperset", "version": 1, "meta": { ... }, "items": [ ... ] }'></textarea>
      <button class="btn" id="pg-use-json" type="button">用这段 JSON 生成</button>
    </details>

    <p class="pg-msg" id="pg-msg" hidden></p>
    <p class="pg-status" id="pg-status">正在读取本机组卷…</p>
  </section>
