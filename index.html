<script>
/* 兜底提示（所有页面通用）：本站正文全靠 JS 渲染，脚本一旦解析或执行失败
   （例如旧版 Safari 不支持某些新语法）就是纯白屏、毫无提示。
   这段刻意写成 ES5 —— 没有箭头函数、const/let、模板字符串、?.、?? ——
   保证在「导致 app.js 报错的那个老浏览器」里它自己还能跑起来。
   同一页面只提示一次；图片等资源 404 不提示（那时 e.target 不是 window）。 */
(function () {
  var shown = false;
  function paint(msg) {
    if (shown) return;
    shown = true;
    var text = "页面加载出错：" + msg + "　请使用最新版 Chrome / Safari，或刷新重试";
    function put() {
      try {
        var bar = document.createElement("div");
        bar.id = "compat-js-error";
        bar.setAttribute("role", "alert");
        bar.style.cssText =
          "position:fixed;left:0;right:0;top:0;z-index:2147483647;" +
          "background:#1f2430;color:#fff;border-bottom:1px solid #000;" +
          "padding:10px 14px;text-align:center;" +
          "font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;" +
          "box-shadow:0 2px 10px rgba(0,0,0,.35);";
        bar.textContent = text;
        var host = document.body || document.documentElement;
        host.insertBefore(bar, host.firstChild);
      } catch (err) { /* 提示条自己失败就算了，别再连带把页面搞崩 */ }
    }
    if (document.body) put();
    else if (document.addEventListener) document.addEventListener("DOMContentLoaded", put, false);
    else setTimeout(put, 0);
  }
  function brief(v) {
    var s = "";
    if (v && v.message) s = String(v.message);
    else if (v) s = String(v);
    s = s.replace(/\s+/g, " ");
    if (s.length > 80) s = s.slice(0, 80) + "…";
    return s || "未知错误";
  }
  if (!window.addEventListener) return;
  window.addEventListener("error", function (e) {
    if (!e || (e.target && e.target !== window)) return;
    if (e.error) paint(brief(e.error));
    else if (e.message) paint(brief(e.message));
  }, false);
  window.addEventListener("unhandledrejection", function (e) {
    paint(brief(e && e.reason));
  }, false);
})();
</script>
